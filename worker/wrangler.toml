name = "naija-biro-rooms"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# One Durable Object per room code. Free-plan Workers must use SQLite-backed classes.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Your deployed Vercel site (the room server reports finished matches to <API_URL>/api/match/report)
API_URL = "http://localhost:3000"
# Comma-separated list of sites allowed to open room sockets. Empty = allow any origin (fine for local dev).
ALLOWED_ORIGINS = ""

# Secret (do NOT put it here):   npx wrangler secret put GAME_SECRET
# For local dev create worker/.dev.vars  (see .dev.vars.example)
